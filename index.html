<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      카카오톡 인앱 브라우저 확대 깨짐 방지 세트
       · minimum/maximum-scale=1 + user-scalable=no → 핀치·더블탭 확대 차단
       · viewport-fit=cover → 노치/다이나믹아일랜드 safe-area 대응
       · shrink-to-fit=no   → 구형 웹뷰가 페이지를 멋대로 축소하는 것 방지
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />

    <!-- 영문 = Inter / 한글 = Pretendard (동적 서브셋: 쓰는 글자만 받아서 가볍다) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <title>카카오톡 테마 만들기</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
